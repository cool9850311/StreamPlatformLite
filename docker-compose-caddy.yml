# Docker Compose with Caddy (Recommended)
# This configuration uses Caddy for automatic HTTPS with Let's Encrypt
# No manual certificate management required!

version: '3.8'

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
  backend:
    driver: bridge
    internal: true   # no outbound internet for data tier

services:

  postgres-go:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: YOUR_PASSWORD
      POSTGRES_DB: go_service
    volumes:
      - pg-go-data:/var/lib/postgresql/data
    networks: [backend]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, FOWNER, DAC_OVERRIDE]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d go_service"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-core:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: YOUR_PASSWORD
      POSTGRES_DB: auth_db
    volumes:
      - pg-core-data:/var/lib/postgresql/data
    networks: [backend]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, FOWNER, DAC_OVERRIDE]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    restart: always
    networks: [backend]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, SETPCAP]   # redis entrypoint chowns /data, uses setpriv --bounding-set (needs SETPCAP), drops to redis user
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  go-service:
    build:
      context: ..
      dockerfile: StreamPlatformLite-Backend/Dockerfile
    restart: always
    ports:
      # Only expose RTMP port for streaming
      # HTTP API (8080) is only accessible through Caddy for better security
      - 1935:1935
    depends_on:
      postgres-go:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      POSTGRESQL_DSN: postgres://root:YOUR_PASSWORD@postgres-go:5432/go_service?sslmode=disable
      APP_SECRET_KEY: YOUR_SECRET_KEY
      DOMAIN: example.com
      FRONTEND_DOMAIN: example.com
      REDIS_URI: redis:6379
      HTTPS: "true"
      ENABLE_GIN_LOG: "false"
      LOG_LEVEL: "INFO"
      SCHEMA_AUTO_MIGRATE: "true"
      # Rate limiting configuration (defaults shown)
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_CHAT_POST_PER_MINUTE: "10"
      RATE_LIMIT_CHAT_DELETE_PER_MINUTE: "10"
    volumes:
      - hls-data:/app/hls
    networks: [internal, backend]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]   # entrypoint.sh chowns /app/hls then su-exec drops to appuser
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  core-service:
    build:
      context: ../StreamPlatformLite-Core
    restart: always
    depends_on:
      postgres-core:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      POSTGRESQL_DSN: postgres://root:YOUR_PASSWORD@postgres-core:5432/auth_db?sslmode=disable
      APP_SECRET_KEY: YOUR_SECRET_KEY
      DISCORD_CLIENT_ID: YOUR_CLIENT_ID
      DISCORD_CLIENT_SECRET: YOUR_CLIENT_SECRET
      DISCORD_ADMIN_ID: YOUR_ADMIN_ID
      DISCORD_GUILD_ID: YOUR_GUILD_ID
      DOMAIN: example.com/auth
      FRONTEND_DOMAIN: example.com
      REDIS_URI: redis:6379
      HTTPS: "true"
      ENABLE_GIN_LOG: "false"
      LOG_LEVEL: "INFO"
      SCHEMA_AUTO_MIGRATE: "true"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_LOGIN_PER_MINUTE: "5"
      RATE_LIMIT_OAUTH_INIT_PER_MINUTE: "5"
      RATE_LIMIT_LOGOUT_PER_MINUTE: "10"
      RATE_LIMIT_CHANGE_PASSWORD_PER_HOUR: "10"
    networks: [internal, backend]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ../StreamPlatformLite-Frontend
      dockerfile: ../StreamPlatformLite-Frontend/Dockerfile
      args:
        # ENABLE_STRICT_CSP is a build-time arg (baked into nuxt.config.ts during npm run build)
        ENABLE_STRICT_CSP: "true"
    restart: always
    environment:
      - NODE_ENV=production
      - NUXT_PUBLIC_BACKEND_URL=https://example.com/api
      - NUXT_PUBLIC_AUTH_URL=https://example.com/auth
    networks: [internal]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "80:80"    # HTTP (auto redirects to HTTPS)
      - "443:443"  # HTTPS
      - "443:443/udp"  # HTTP/3 (QUIC)
    volumes:
      # Mount Caddyfile configuration
      - ./Caddyfile:/etc/caddy/Caddyfile
      # Persist SSL certificates and Caddy data
      - caddy_data:/data
      - caddy_config:/config
      # Optional: Mount custom certificates directory (for advanced users)
      # Uncomment if you want to use custom certificates like Cloudflare Origin CA
      # - ./certs:/etc/caddy/certs:ro
    depends_on:
      go-service:
        condition: service_healthy
      core-service:
        condition: service_healthy
      frontend:
        condition: service_healthy
    # environment:
      # Optional: Set email for Let's Encrypt notifications
      # Uncomment and set your email
      # - ACME_EMAIL=your-email@example.com

      # Optional: Cloudflare API token for DNS challenge (advanced)
      # Uncomment if using Cloudflare DNS plugin
      # - CLOUDFLARE_API_TOKEN=your_cloudflare_api_token
    networks: [public, internal]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 80 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  pg-go-data:
  pg-core-data:
  hls-data:
  # Caddy volumes for persistent certificate storage
  caddy_data:
    # Stores SSL certificates from Let's Encrypt
  caddy_config:
    # Stores Caddy configuration cache

# Notes:
# 1. Replace 'example.com' in Caddyfile with your actual domain
# 2. Ensure your domain's DNS A record points to your server's IP address
# 3. Ensure ports 80 and 443 are open in your firewall
# 4. On first run, Caddy will automatically obtain SSL certificates (takes 1-2 minutes)
# 5. Certificates are automatically renewed before expiration
# 6. To use custom certificates, uncomment the certs volume mount and follow Caddyfile examples
