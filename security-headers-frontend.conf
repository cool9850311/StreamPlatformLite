# Frontend-specific Content Security Policy
# Include this ONLY in the frontend (/) location — NOT in the /api location.
# The /api location gets its own CSP from the Go backend (default-src 'none').

# Clear any CSP the upstream (Nuxt) might set to avoid duplicate headers
proxy_hide_header Content-Security-Policy;

# SPA CSP:
#   script-src 'unsafe-inline'  — pre-built SPA has no per-request nonce
#   blob:                        — HLS.js Web Worker + MSE video segments
#   style-src 'unsafe-inline'   — runtime CSS injection (headlessui, plyr, etc.)
#   style-src-attr 'none'       — blocks CSS if()-based exfiltration (PortSwigger 2025)
#   img-src cdn.discordapp.com  — Discord user avatars
#   media-src blob:             — HLS video segments
#   font-src data:              — inline base64 fonts
add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob: 'unsafe-inline'; style-src 'self' 'unsafe-inline'; style-src-attr 'none'; img-src 'self' https://cdn.discordapp.com data:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
