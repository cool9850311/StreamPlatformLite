# Docker Compose for Local HTTPS Development with Nginx
# Based on docker-compose-example.yml, adapted for local HTTPS testing with mkcert
# Domain: localtest.me (resolves to 127.0.0.1 via public DNS - no /etc/hosts needed)
#
# Prerequisites:
#   1. Install mkcert: brew install mkcert
#   2. Generate certs:
#      mkdir -p local/certs
#      mkcert -cert-file local/certs/cert.pem -key-file local/certs/key.pem localtest.me localhost 127.0.0.1
#   3. Run: docker compose -f local/docker-compose.nginx.yml up --build

version: '3.8'

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
  backend:
    driver: bridge
    internal: true   # no outbound internet for data tier

services:

  mongo:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo-data:/data/db
    networks: [backend]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_READ_SEARCH]   # mongo entrypoint needs DAC_READ_SEARCH to find/traverse drwx------ data dirs before gosu switch
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping:1})"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  redis:
    image: redis:latest
    restart: always
    networks: [backend]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, SETPCAP]   # redis entrypoint chowns /data, uses setpriv --bounding-set (needs SETPCAP), drops to redis user
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  go-service:
    build:
      context: ../../StreamPlatformLite-Backend
    restart: always
    ports:
      # Only expose RTMP port for streaming
      # HTTP API (8080) is only accessible through Nginx for better security
      - 1935:1935
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      MONGODB_URI: mongodb://root:example@mongo:27017
      MONGODB_DATABASE: go_service
      APP_SECRET_KEY: YOUR_SECRET_KEY
      DISCORD_CLIENT_ID: YOUR_CLIENT_ID
      DISCORD_CLIENT_SECRET: YOUR_CLIENT_SECRET
      DISCORD_ADMIN_ID: YOUR_ADMIN_ID
      DISCORD_GUILD_ID: YOUR_GUILD_ID
      DOMAIN: localtest.me/api
      FRONTEND_DOMAIN: localtest.me
      REDIS_URI: redis:6379
      HTTPS: "true"
      ENABLE_GIN_LOG: "false"
      LOG_LEVEL: "INFO"
      # Rate limiting configuration (defaults shown)
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_LOGIN_PER_MINUTE: "5"
      RATE_LIMIT_OAUTH_INIT_PER_MINUTE: "5"
      RATE_LIMIT_LOGOUT_PER_MINUTE: "10"
      RATE_LIMIT_CHAT_POST_PER_MINUTE: "10"
      RATE_LIMIT_CHAT_DELETE_PER_MINUTE: "10"
      RATE_LIMIT_CHANGE_PASSWORD_PER_HOUR: "10"
    volumes:
      - hls-data:/app/hls
    networks: [internal, backend]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]   # entrypoint.sh chowns /app/hls then su-exec drops to appuser
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ../../StreamPlatformLite-Frontend
      args:
        # ENABLE_STRICT_CSP is a build-time arg (baked into nuxt.config.ts during npm run build)
        ENABLE_STRICT_CSP: "true"
    restart: always
    environment:
      - NODE_ENV=production
      - NUXT_PUBLIC_BACKEND_URL=https://localtest.me/api
    networks: [internal]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"    # HTTP (redirects to HTTPS)
      - "443:443"  # HTTPS
    volumes:
      # Mount local Nginx config (localtest.me domain + mkcert cert paths)
      - ./nginx.conf:/etc/nginx/nginx.conf
      # Security headers configurations
      - ../security-headers.conf:/etc/nginx/conf.d/security-headers.conf
      - ../security-headers-proxy.conf:/etc/nginx/conf.d/security-headers-proxy.conf
      - ../security-headers-frontend.conf:/etc/nginx/conf.d/security-headers-frontend.conf
      # Mount mkcert-generated certificates
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      go-service:
        condition: service_healthy
      frontend:
        condition: service_healthy
    extra_hosts:
      # Allow Nginx container to resolve localtest.me back to the host
      - "localtest.me:host-gateway"
    networks: [public, internal]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN]   # nginx master binds <1024, chowns cache, forks workers as nginx user
    healthcheck:
      test: ["CMD-SHELL", "[ -f /var/run/nginx.pid ] && kill -0 $(cat /var/run/nginx.pid) || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  # MongoDB persistent data storage
  mongo-data:
  # HLS streaming data storage (for live streaming)
  hls-data:

# Notes:
# 1. Copy this file to docker-compose.nginx.yml and fill in YOUR_* placeholders
# 2. localtest.me automatically resolves to 127.0.0.1 via public DNS - no /etc/hosts required
# 3. mkcert certificates are mounted read-only; regenerate with mkcert if expired
