# Docker Compose Example for StreamPlatformLite with Nginx
# Copy this file to docker-compose.yml and customize the configuration
# See: https://github.com/cool9850311/StreamPlatformLite/wiki/Configuration-%E2%80%90-docker-compose

version: '3.8'

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
  backend:
    driver: bridge
    internal: true   # no outbound internet for data tier

services:

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: example
      POSTGRES_DB: go_service
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks: [backend]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d go_service"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    restart: always
    networks: [backend]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, SETPCAP]   # redis entrypoint chowns /data, uses setpriv --bounding-set (needs SETPCAP), drops to redis user
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  go-service:
    build:
      context: ../StreamPlatformLite-Backend
    restart: always
    ports:
      # Only expose RTMP port for streaming
      # HTTP API (8080) is only accessible through Nginx for better security
      - 1935:1935
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      POSTGRESQL_DSN: ${POSTGRESQL_DSN}
      # IMPORTANT: Replace all YOUR_* placeholders with actual values
      APP_SECRET_KEY: YOUR_SECRET_KEY
      DISCORD_CLIENT_ID: YOUR_CLIENT_ID
      DISCORD_CLIENT_SECRET: YOUR_CLIENT_SECRET
      DISCORD_ADMIN_ID: YOUR_ADMIN_ID
      DISCORD_GUILD_ID: YOUR_GUILD_ID
      # Replace example.com with your actual domain
      DOMAIN: example.com/api
      FRONTEND_DOMAIN: example.com
      REDIS_URI: redis:6379
      HTTPS: "true"
      ENABLE_GIN_LOG: "false"
      LOG_LEVEL: "INFO"
      SCHEMA_AUTO_MIGRATE: "true"
      # Rate limiting configuration (defaults shown)
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_LOGIN_PER_MINUTE: "5"
      RATE_LIMIT_OAUTH_INIT_PER_MINUTE: "5"
      RATE_LIMIT_LOGOUT_PER_MINUTE: "10"
      RATE_LIMIT_CHAT_POST_PER_MINUTE: "10"
      RATE_LIMIT_CHAT_DELETE_PER_MINUTE: "10"
      RATE_LIMIT_CHANGE_PASSWORD_PER_HOUR: "10"
    volumes:
      - hls-data:/app/hls
    networks: [internal, backend]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]   # entrypoint.sh chowns /app/hls then su-exec drops to appuser
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ../StreamPlatformLite-Frontend
      args:
        # ENABLE_STRICT_CSP is a build-time arg (baked into nuxt.config.ts during npm run build)
        ENABLE_STRICT_CSP: "true"
    restart: always
    environment:
      - NODE_ENV=production
      # Replace example.com with your actual domain
      - NUXT_PUBLIC_BACKEND_URL=https://example.com/api
    networks: [internal]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"    # HTTP (redirects to HTTPS)
      - "443:443"  # HTTPS
    volumes:
      # Mount Nginx configuration file (copy from nginx.conf.example)
      - ./nginx.conf:/etc/nginx/nginx.conf
      # Security headers configurations (shared between prod and local)
      - ./security-headers.conf:/etc/nginx/conf.d/security-headers.conf
      - ./security-headers-proxy.conf:/etc/nginx/conf.d/security-headers-proxy.conf
      - ./security-headers-frontend.conf:/etc/nginx/conf.d/security-headers-frontend.conf
      # Mount SSL certificates directory (place your .crt and .key files here)
      - ./certs:/etc/nginx/certs
    depends_on:
      go-service:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [public, internal]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN]   # nginx master binds <1024, chowns cache, forks workers as nginx user
    healthcheck:
      test: ["CMD-SHELL", "[ -f /var/run/nginx.pid ] && kill -0 $(cat /var/run/nginx.pid) || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  # PostgreSQL persistent data storage
  pg-data:
  # HLS streaming data storage (for live streaming)
  hls-data:
